<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nat Freq</title>
    <style>
        /* Simple, efficient styling */
        body {
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            max-width: 600px; margin: 40px auto;
            padding: 20px;
            background-color: #9ccbac;
            color: #003f42
        }
        .container { border: 1px solid #ccc;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            background-color: #addcbd;}
        .form-group { margin-bottom: 15px;}
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="number"], input[type="text"] { width: 100%; padding: 10px 20px; box-sizing: border-box; border-radius: 20px; font-size: 20px}
        button { background-color: #3473b7; color: white; border: none; padding: 15px 20px; cursor: pointer; border-radius: 20px; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        .result { margin-top: 20px; padding: 15px; background-color: #d4edda; color: #155724; border-radius: 20px; }
        .error { margin-top: 20px; padding: 15px; background-color: #f8d7da; color: #721c24; border-radius: 20px; }



        


        /* --- Updated Floating Button Logic --- */

        .floating-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            /* Key Change: Stacks items bottom-to-top. 
               First item in HTML (Button) goes to bottom. 
               Second item (Popup) stacks on top of it. */
            flex-direction: column-reverse; 
            align-items: flex-end;
            z-index: 1000;
        }

        .info-btn {
            font-family: 'Lucida Sans', sans-serif;
            background-color: #155724;
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            opacity: 0.4;
            transition: background-color 0.3s ease, opacity 0.3s ease, transform 0.2s;
        }

        .info-btn:hover {
            background-color: #0f3e1b;
            opacity: 0.7;
            transform: scale(1.1);
        }

        .info-popup {
            background-color: #333;
            color: #fff;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 10px; /* Becomes visual margin-bottom relative to element order */
            font-size: 14px;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            
            visibility: hidden;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
        }

        /* Key Selector: When Button is hovered, affect the IMMEDIATE NEXT sibling (.info-popup) */
        .info-btn:hover + .info-popup {
            visibility: visible;
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class = "container">
        <h1>ML based Natural Frequency Estimator</h1>
        <form method = "POST">

            <div class = "form-group">
                <label for = "val1">First input</label>
                <input type = "number" name="val1" step="any">
            </div>

            <div class = "form-group">
                <label for = "val2">Second input</label>
                <input type = "number" name="val2" step="any">
            </div>

            <div class = "form-group">
                <label for = "val3">Third input</label>
                <input type = "number" name="val3" step="any">
            </div>


            <button type = "submit">Estimate natural frequency</button>
        </form>

        {% if error %}
        <div class = "error">
            <strong></strong> {{error}}
        </div>
        {% endif %}

        {% if result is not none %}
        <div class = "result">
            <strong>Estimated natural frequency is {{result}} </strong>
        </div>
        {% endif %}
    </div>

    <div class="floating-container">
        <button type="button" class="info-btn">i</button>
        <div class="info-popup">
            v1.0 | Created by Lokesh & Rajeev
        </div>
        
    </div>
</body>
